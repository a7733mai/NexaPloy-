{% extends "templates/dashboard_base.html" %}

{% block page_title %}<a href="/dashboard/sites" class="muted">{{ _("Sites") }}</a> <span class="muted">/</span> <span class="ltr" id="nx-site-title"></span>{% endblock %}

{% block head %}
{# site tools (usage, backup downloads, config editor): plain script so it registers before Alpine starts #}
<script src="/assets/nexaploy/js/site_tools.js"></script>
<style>
	.nx-meter { height: 8px; border-radius: 99px; background: var(--nx-border); overflow: hidden; }
	.nx-meter > span { display: block; height: 100%; background: var(--nx-primary); border-radius: inherit; }
	.nx-meter.warn > span { background: var(--nx-warning); }
	.nx-meter.over > span { background: var(--nx-danger); }
	.nx-bars { display: flex; align-items: flex-end; gap: 3px; height: 72px; }
	.nx-bars > span { flex: 1 1 0; min-width: 3px; background: var(--nx-primary-soft); border-block-start: 2px solid var(--nx-primary); }
	.nx-config td { vertical-align: middle; }
	.nx-config input.input { width: 100%; min-width: 160px; }
	.nx-config tr.removed td { opacity: .5; text-decoration: line-through; }
</style>
{% endblock %}

{% block content %}
<div class="stack" x-data="nxSite" x-cloak x-effect="if (site) document.getElementById('nx-site-title').textContent = site.name">
	<template x-if="loading && !site"><div class="loading"><span class="spinner"></span> {{ _("Loading…") }}</div></template>
	<template x-if="error && !site"><div class="alert danger" x-text="error"></div></template>

	<template x-if="site">
		<div class="stack" x-data="nxSiteTools">
			<!-- Summary -->
			<section class="card">
				<div class="card-head">
					<h2 class="ltr" x-text="site.name"></h2>
					<span :class="nx.statusClass(site.status)" x-text="__(site.status)"></span>
					<a class="btn sm" :href="site.url" target="_blank" rel="noopener" x-show="site.status === 'Active'">{{ _("Open site") }}</a>
					<a class="btn sm" :href="site.url + '/app'" target="_blank" rel="noopener" x-show="site.status === 'Active'">{{ _("Open desk") }}</a>
					<a class="btn sm" :href="'/dashboard/insights?site=' + encodeURIComponent(site.name)">{{ _("Insights") }}</a>
					<a class="btn sm" :href="'/dashboard/support?new=1&site=' + encodeURIComponent(site.name)">{{ _("Get help") }}</a>
				</div>
				<div class="card-body">
					<dl class="kv">
						<dt>{{ _("Frappe version") }}</dt><dd x-text="site.frappe_major ? 'v' + site.frappe_major : '—'"></dd>
						<dt>{{ _("Bench") }}</dt><dd class="ltr" x-text="site.bench.bench_name || site.bench.name"></dd>
						<dt>{{ _("Server") }}</dt>
						<dd>
							<template x-if="site.server.own"><a class="ltr" :href="'/dashboard/server?name=' + encodeURIComponent(site.server.name)" x-text="site.server.hostname || site.server.name"></a></template>
							<template x-if="!site.server.own"><span>{{ _("Shared hosting") }}</span></template>
						</dd>
						<dt>{{ _("Plan") }}</dt>
						<dd>
							<template x-if="site.plan"><span x-text="site.plan.title + ' · ' + nx.money(site.plan.price_monthly, site.plan.currency) + ' ' + __('/ month')"></span></template>
							<template x-if="!site.plan"><span class="muted">—</span></template>
							<template x-if="usage && usage.over_limit"><span class="badge danger">{{ _("Over plan limit") }}</span></template>
							<template x-if="usage && usage.throttled"><span class="badge warning">{{ _("Throttled") }}</span></template>
						</dd>
						<dt>{{ _("Created") }}</dt><dd x-text="nx.fmtDate(site.creation)"></dd>
					</dl>
					<template x-if="site.status === 'Pending'"><div class="alert info" style="margin-block-start: 14px">{{ _("The site is being created. This page refreshes automatically.") }}</div></template>
					<template x-if="site.status === 'Moving'"><div class="alert info" style="margin-block-start: 14px">{{ _("The site is being moved to another bench. Actions are disabled until the move finishes.") }}</div></template>
					<template x-if="site.status === 'Renaming'"><div class="alert info" style="margin-block-start: 14px">{{ _("The site is being renamed. It is briefly in maintenance mode; this page moves to the new name when done.") }}</div></template>
					<template x-if="site.status === 'Broken'"><div class="alert danger" style="margin-block-start: 14px">{{ _("The last operation failed. Check the jobs log, restore a backup or contact support.") }}</div></template>
				</div>
			</section>

			<div class="tabs" role="tablist">
				<button type="button" :class="{ active: tab === 'apps' }" @click="tab = 'apps'">{{ _("Apps") }}</button>
				<button type="button" :class="{ active: tab === 'domains' }" @click="tab = 'domains'">{{ _("Domains") }}</button>
				<button type="button" :class="{ active: tab === 'backups' }" @click="tab = 'backups'">{{ _("Backups") }}</button>
				<button type="button" :class="{ active: tab === 'usage' }" @click="tab = 'usage'">{{ _("Usage") }}</button>
				<button type="button" x-show="site.can_write !== false" :class="{ active: tab === 'config' }" @click="tab = 'config'; if (!cfg.loaded && !cfg.loading) loadConfig(false)">{{ _("Config") }}</button>
				<button type="button" :class="{ active: tab === 'lifecycle' }" @click="tab = 'lifecycle'; $dispatch('nx-lifecycle-open')">{{ _("Lifecycle") }}</button>
				<button type="button" :class="{ active: tab === 'jobs' }" @click="tab = 'jobs'">{{ _("Jobs") }} <span class="spinner" x-show="active" style="width: 12px; height: 12px"></span></button>
				<button type="button" :class="{ active: tab === 'settings' }" @click="tab = 'settings'">{{ _("Settings") }}</button>
			</div>

			<!-- Apps -->
			<div class="grid cols-2" x-show="tab === 'apps'">
				<section class="card">
					<div class="card-head"><h2>{{ _("Installed apps") }}</h2></div>
					<div class="card-body flush">
						<table class="nx-table">
							<tbody>
								<tr><td><div>Frappe Framework</div><div class="small muted ltr">frappe</div></td><td class="actions"><span class="badge success">{{ _("Installed") }}</span></td></tr>
								<template x-for="a in site.apps" :key="a.app">
									<tr>
										<td><div x-text="a.title"></div><div class="small muted ltr" x-text="a.app"></div></td>
										<td class="actions">
											<span :class="nx.statusClass(a.status)" x-text="__(a.status)"></span>
											<button class="btn sm danger" type="button" :disabled="site.status !== 'Active' || busy.uninstall_app"
												@click="run('uninstall_app', { app: a.app }, __('Uninstall {0}? Its data will be removed from the site.', [a.title]))">{{ _("Uninstall") }}</button>
										</td>
									</tr>
								</template>
							</tbody>
						</table>
					</div>
				</section>
				<section class="card">
					<div class="card-head">
						<h2>{{ _("Available apps") }}</h2>
						<a class="btn sm" :href="'/dashboard/marketplace?major=' + (site.frappe_major || '')">{{ _("Marketplace") }}</a>
					</div>
					<div class="card-body flush">
						<template x-if="!site.available_apps.length">
							<div class="empty">{{ _("All apps of this bench are installed. More apps need a bench with those apps.") }}</div>
						</template>
						<table class="nx-table" x-show="site.available_apps.length">
							<tbody>
								<template x-for="a in site.available_apps" :key="a.app">
									<tr>
										<td>
											<div x-text="a.title"></div>
											<div class="small muted"><span class="ltr" x-text="a.app"></span><template x-if="a.category"><span x-text="' · ' + __(a.category)"></span></template></div>
										</td>
										<td class="small" x-text="a.pricing === 'Paid' ? nx.money(a.price_monthly) + ' ' + __('/ month') : __('Free')"></td>
										<td class="actions">
											<button class="btn sm primary" type="button" :disabled="site.status !== 'Active' || busy.install_app"
												@click="run('install_app', { app: a.app })">{{ _("Install") }}</button>
										</td>
									</tr>
								</template>
							</tbody>
						</table>
					</div>
				</section>
			</div>

			<!-- Domains -->
			<section class="card" x-show="tab === 'domains'">
				<div class="card-head"><h2>{{ _("Domains") }}</h2></div>
				<div class="card-body stack">
					<form class="row" @submit.prevent="addDomain()">
						<input class="input ltr" style="max-width: 360px" type="text" x-model="domain" placeholder="erp.example.com" spellcheck="false">
						<button class="btn primary" type="submit" :disabled="site.status !== 'Active' || busy.add_domain || !domain.trim()">{{ _("Add domain") }}</button>
					</form>
					<div class="small muted">{{ _("Point a CNAME (or A record) for the domain to your site before adding it, so the certificate can be issued.") }}</div>
				</div>
				<div class="card-body flush">
					<table class="nx-table">
						<tbody>
							<tr>
								<td class="ltr" x-text="site.name"></td>
								<td class="actions"><span class="badge plain">{{ _("Primary") }}</span></td>
							</tr>
							<template x-for="d in site.domains" :key="d.domain">
								<tr>
									<td><a class="ltr" :href="'https://' + d.domain" target="_blank" rel="noopener" x-text="d.domain"></a></td>
									<td class="actions">
										<span :class="nx.statusClass(d.status)" x-text="__(d.status)"></span>
										<button class="btn sm danger" type="button" :disabled="site.status !== 'Active' || d.status === 'Removing' || busy.remove_domain"
											@click="run('remove_domain', { domain: d.domain }, __('Remove domain {0}?', [d.domain]))">{{ _("Remove") }}</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</section>

			<!-- Backups -->
			<section class="card" x-show="tab === 'backups'">
				<div class="card-head">
					<h2>{{ _("Backups") }}</h2>
					<label class="check small"><input type="checkbox" x-model="withFiles"> {{ _("Include files") }}</label>
					<button class="btn primary" type="button" :disabled="!['Active', 'Broken'].includes(site.status) || busy.backup"
						@click="run('backup', { with_files: withFiles ? 1 : 0 })">
						<span class="spinner" x-show="busy.backup"></span> {{ _("Backup now") }}
					</button>
				</div>
				<div class="card-body flush table-wrap">
					<template x-if="!site.backups.length"><div class="empty">{{ _("No backups yet.") }}</div></template>
					<table class="nx-table" x-show="site.backups.length">
						<thead><tr><th>{{ _("Created") }}</th><th>{{ _("Type") }}</th><th>{{ _("Files") }}</th><th>{{ _("Size") }}</th><th>{{ _("Status") }}</th><th></th></tr></thead>
						<tbody>
							<template x-for="b in site.backups" :key="b.name">
								<tr>
									<td class="nowrap" x-text="nx.fmtDate(b.created_at || b.creation)"></td>
									<td x-text="__(b.purpose)"></td>
									<td x-text="b.with_files ? __('Yes') : __('No')"></td>
									<td class="nowrap" x-text="nx.bytes(b.size)"></td>
									<td><span :class="nx.statusClass(b.status)" x-text="__(b.status)"></span></td>
									<td class="actions">
										<template x-for="f in backupFiles(b.name)" :key="f.file_type">
											<button class="btn sm ghost" type="button" x-show="f.downloadable" :disabled="downloading === b.name + ':' + f.file_type"
												:title="__('Download') + ' · ' + nx.bytes(f.size)" @click="download(b.name, f.file_type)">
												<span class="spinner" x-show="downloading === b.name + ':' + f.file_type"></span>
												<span x-text="'⬇ ' + fileLabel(f.file_type)"></span>
											</button>
										</template>
										<button class="btn sm" type="button" x-show="b.restorable" :disabled="!['Active', 'Broken'].includes(site.status) || busy.restore"
											@click="run('restore', { backup: b.name }, __('Restore this backup? The current data of {0} will be replaced.', [site.name]))">{{ _("Restore") }}</button>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
			</section>

			<!-- Usage -->
			<div class="stack" x-show="tab === 'usage'">
				<template x-if="usageLoading && !usage"><div class="loading"><span class="spinner"></span> {{ _("Loading…") }}</div></template>
				<template x-if="usageError && !usage"><div class="alert danger" x-text="usageError"></div></template>
				<template x-if="usage">
					<div class="stack">
						<section class="card">
							<div class="card-head">
								<h2>{{ _("Usage today") }}</h2>
								<span class="small muted">{{ _("UTC day; CPU resets at midnight UTC") }}</span>
								<span class="spacer"></span>
								<button class="btn sm ghost" type="button" @click="loadUsage()" :disabled="usageLoading">{{ _("Refresh") }}</button>
							</div>
							<div class="card-body stack">
								<template x-if="usage.throttled"><div class="alert warning">{{ _("This site is over its daily CPU budget and requests are rate limited until midnight UTC. Upgrade the plan to lift the limit now.") }}</div></template>
								<template x-if="usage.suspended"><div class="alert danger">{{ _("This site is in maintenance mode because it is over its plan limits. Upgrade the plan or reduce usage to bring it back.") }}</div></template>
								<template x-if="!usage.throttled && !usage.suspended && usage.status.status === 'over'"><div class="alert danger">{{ _("This site is over its plan limits.") }}</div></template>
								<template x-if="usage.status.status === 'warn'"><div class="alert warning">{{ _("This site is close to its plan limits.") }}</div></template>
								<template x-for="m in meters()" :key="m.key">
									<div>
										<div class="row between small"><span x-text="m.label"></span><span class="ltr" x-text="meterText(m)"></span></div>
										<div class="nx-meter" :class="m.status" role="progressbar" :aria-valuenow="m.percent || 0" aria-valuemin="0" aria-valuemax="100"><span :style="'width:' + meterWidth(m)"></span></div>
									</div>
								</template>
								<div class="small muted">
									<span x-text="__('Requests today: {0}', [fmtNum(usage.usage.requests, 0)])"></span>
									<template x-if="usage.updated_at"><span x-text="' · ' + __('Updated {0}', [nx.fmtDate(usage.updated_at)])"></span></template>
								</div>
							</div>
						</section>
						<section class="card" x-show="usage.history.length">
							<div class="card-head"><h2>{{ _("CPU time per day") }}</h2><span class="small muted">{{ _("Last 30 days") }}</span></div>
							<div class="card-body">
								<div class="nx-bars" dir="ltr">
									<template x-for="r in usage.history" :key="r.date">
										<span :style="'height:' + barHeight(r)" :title="r.date + ': ' + fmtNum(r.cpu_seconds) + ' s · ' + fmtNum(r.requests, 0) + ' ' + __('requests')"></span>
									</template>
								</div>
							</div>
						</section>
						<section class="card">
							<div class="card-head">
								<h2>{{ _("Plan") }}</h2>
								<template x-if="usage.plan"><span class="small muted" x-text="usage.plan.title"></span></template>
							</div>
							<div class="card-body flush">
								<template x-if="!usage.plans.length"><div class="empty">{{ _("No plans available.") }}</div></template>
								<table class="nx-table" x-show="usage.plans.length">
									<tbody>
										<template x-for="p in usage.plans" :key="p.name">
											<tr>
												<td><div x-text="planLabel(p)"></div><div class="small muted" x-text="planLimits(p)"></div></td>
												<td class="actions">
													<template x-if="usage.plan && usage.plan.name === p.name"><span class="badge plain">{{ _("Current plan") }}</span></template>
													<template x-if="!usage.plan || usage.plan.name !== p.name">
														<button class="btn sm" :class="{ primary: isUpgrade(p) }" type="button" :disabled="planBusy || !usage.can_change_plan || !['Active', 'Suspended'].includes(site.status)"
															@click="changePlan(p)" x-text="isUpgrade(p) ? __('Upgrade plan') : __('Switch')"></button>
													</template>
												</td>
											</tr>
										</template>
									</tbody>
								</table>
								<template x-if="!usage.can_change_plan"><div class="small muted" style="padding: 10px 18px">{{ _("Only team owners, admins and billing members can change the plan.") }}</div></template>
							</div>
						</section>
					</div>
				</template>
			</div>

			<!-- Config -->
			<section class="card" x-show="tab === 'config'">
				<div class="card-head">
					<h2>{{ _("Site config") }}</h2>
					<span class="small muted ltr">site_config.json</span>
					<span class="spacer"></span>
					<button class="btn sm ghost" type="button" :disabled="cfg.loading" @click="loadConfig(true)"><span class="spinner" x-show="cfg.loading"></span> {{ _("Reload") }}</button>
					<button class="btn sm primary" type="button" x-show="site.can_write !== false" :disabled="saving || !cfg.loaded || !dirty() || site.status !== 'Active'" @click="saveConfig()"><span class="spinner" x-show="saving"></span> {{ _("Save changes") }}</button>
				</div>
				<div class="card-body stack">
					<div class="small muted">{{ _("Values are JSON: numbers, true/false, lists and objects are typed; text values stay text. Secrets are hidden; type a new value to replace one. Database, encryption and Nexaploy-managed keys are read-only.") }}</div>
					<template x-if="cfg.error"><div class="alert danger" x-text="cfg.error"></div></template>
					<template x-if="cfg.loading && !cfg.loaded"><div class="loading"><span class="spinner"></span> {{ _("Reading the config from the server…") }}</div></template>
				</div>
				<div class="card-body flush table-wrap" x-show="cfg.loaded">
					<table class="nx-table nx-config">
						<thead><tr><th>{{ _("Key") }}</th><th>{{ _("Value") }}</th><th></th></tr></thead>
						<tbody>
							<template x-for="r in cfg.rows" :key="r.key">
								<tr :class="{ removed: r.removed }">
									<td class="mono ltr nowrap"><span x-text="r.key"></span> <template x-if="r.secret"><span class="badge plain">{{ _("secret") }}</span></template></td>
									<td>
										<template x-if="r.readonly"><span class="mono ltr small" x-text="r.text"></span></template>
										<template x-if="!r.readonly"><input :readonly="site.can_write === false" class="input ltr mono" type="text" x-model="r.text" :disabled="r.removed" spellcheck="false" @focus="if (r.secret && r.text === r.origText) r.text = ''" @blur="if (r.secret && r.text === '') r.text = r.origText"></template>
									</td>
									<td class="actions">
										<template x-if="r.readonly"><span class="badge plain">{{ _("Read-only") }}</span></template>
										<template x-if="!r.readonly"><button class="btn sm ghost" type="button" @click="r.isNew && !r.removed ? cfg.rows.splice(cfg.rows.indexOf(r), 1) : (r.removed = !r.removed)" x-text="r.removed ? __('Undo') : __('Remove')"></button></template>
									</td>
								</tr>
							</template>
						</tbody>
					</table>
				</div>
				<div class="card-body" x-show="cfg.loaded">
					<form class="row" @submit.prevent="addRow()">
						<input class="input ltr mono" style="max-width: 240px" type="text" x-model="newKey" placeholder="key_name" spellcheck="false">
						<input class="input ltr mono" style="max-width: 360px" type="text" x-model="newValue" placeholder='value, 1, true, {"a": 1}' spellcheck="false">
						<button class="btn" type="submit" :disabled="!newKey.trim()">{{ _("Add key") }}</button>
					</form>
				</div>
			</section>

			<!-- Lifecycle: staging, move, transfer, rename (public/js/site_tools.js nxSiteLifecycle) -->
			<div class="stack" x-show="tab === 'lifecycle'" x-data="nxSiteLifecycle" @nx-lifecycle-open.window="if (!lc && !lcLoading) loadLifecycle()">
				<template x-if="lcLoading && !lc"><div class="loading"><span class="spinner"></span> {{ _("Loading…") }}</div></template>
				<template x-if="lcError && !lc"><div class="alert danger" x-text="lcError"></div></template>
				<template x-if="lc">
					<div class="stack">
						<!-- Staging -->
						<section class="card">
							<div class="card-head">
								<h2>{{ _("Staging site") }}</h2>
								<span class="spacer"></span>
								<template x-if="lc.staging"><span :class="nx.statusClass(lc.staging.status)" x-text="__(lc.staging.status)"></span></template>
							</div>
							<div class="card-body stack">
								<template x-if="lc.is_staging">
									<div class="stack">
										<div class="alert info">{{ _("This is a staging copy of") }} <a class="ltr" :href="'/dashboard/site?name=' + encodeURIComponent(lc.staging_of)" x-text="lc.staging_of"></a>. {{ _("Outgoing emails are muted and the scheduler is paused. Staging sites are not billed.") }}</div>
										<div class="row" x-show="lc.can_write">
											<button class="btn" type="button" :disabled="lcBusy.staging || !['Active', 'Broken'].includes(lc.status)" @click="refreshStaging()"><span class="spinner" x-show="lcBusy.staging"></span> {{ _("Refresh from production") }}</button>
										</div>
									</div>
								</template>
								<template x-if="!lc.is_staging">
									<div class="stack">
										<span class="muted">{{ _("A copy of this site on the same bench to test updates and changes safely. Emails are muted, the scheduler is paused and email accounts are disabled on the copy.") }}</span>
										<template x-if="lc.staging">
											<div class="row">
												<a class="ltr" :href="'/dashboard/site?name=' + encodeURIComponent(lc.staging.name)" x-text="lc.staging.name"></a>
												<span class="spacer"></span>
												<a class="btn sm" :href="lc.staging.url" target="_blank" rel="noopener" x-show="lc.staging.status === 'Active'">{{ _("Open") }}</a>
												<button class="btn sm" type="button" x-show="lc.can_write" :disabled="lcBusy.staging || site.status !== 'Active' || !['Active', 'Broken'].includes(lc.staging.status)" @click="refreshStaging()"><span class="spinner" x-show="lcBusy.staging"></span> {{ _("Refresh") }}</button>
												<a class="btn sm" :href="'/dashboard/site?name=' + encodeURIComponent(lc.staging.name)">{{ _("Manage") }}</a>
											</div>
										</template>
										<template x-if="!lc.staging && lc.can_write">
											<div class="row">
												<span class="small muted ltr" x-text="lc.staging_name"></span>
												<span class="spacer"></span>
												<button class="btn primary" type="button" :disabled="lcBusy.staging || site.status !== 'Active' || !lc.staging_name" @click="createStaging()"><span class="spinner" x-show="lcBusy.staging"></span> {{ _("Create staging site") }}</button>
											</div>
										</template>
									</div>
								</template>
							</div>
						</section>

						<!-- Move -->
						<section class="card" x-show="lc.can_write && !lc.is_staging">
							<div class="card-head"><h2>{{ _("Move site") }}</h2></div>
							<div class="card-body stack">
								<span class="muted">{{ _("Move the site to another bench on this or another of your servers. The site is backed up, restored on the target bench (migrated) and then removed from the current one.") }}</span>
								<template x-if="!targets().length"><div class="small muted">{{ _("No other bench is available. Deploy a bench group on a server first.") }}</div></template>
								<div class="row" x-show="targets().length">
									<select class="input" style="max-width: 460px" x-model="moveTarget">
										<option value="">{{ _("Choose a target bench…") }}</option>
										<template x-for="b in targets()" :key="b.name">
											<option :value="b.name" :disabled="!b.compatible && !b.upgrade" x-text="targetLabel(b)"></option>
										</template>
									</select>
									<button class="btn primary" type="button" :disabled="lcBusy.move || site.status !== 'Active' || !canMove()" @click="moveSite()"><span class="spinner" x-show="lcBusy.move"></span> {{ _("Move") }}</button>
								</div>
								<template x-if="selectedTarget() && selectedTarget().upgrade">
									<label class="check small"><input type="checkbox" x-model="allowUpgrade"> <span x-text="__('Upgrade from v{0} to v{1} (runs migrate; cannot be undone)', [lc.frappe_major, selectedTarget().frappe_major])"></span></label>
								</template>
								<template x-if="selectedTarget() && !selectedTarget().compatible && !selectedTarget().upgrade"><div class="alert warning" x-text="selectedTarget().reason"></div></template>
								<template x-if="selectedTarget() && !selectedTarget().same_server && !lc.backup_storage"><div class="alert warning">{{ _("Moving to another server needs backup storage configured by the platform administrator.") }}</div></template>
								<template x-if="selectedTarget() && !selectedTarget().same_server"><div class="small muted">{{ _("After a move to another server, every domain of the site must point to the new server.") }}</div></template>
								<template x-if="moveResult && moveResult.dns_hint"><div class="alert info" x-text="moveResult.dns_hint.message"></div></template>
							</div>
						</section>

						<!-- Transfer -->
						<section class="card" x-show="lc.can_admin && !lc.is_staging">
							<div class="card-head"><h2>{{ _("Transfer to another team") }}</h2></div>
							<div class="card-body stack">
								<span class="muted">{{ _("Hand the site over to another team. They accept with the emailed link; from then on they own it and are billed for it.") }}</span>
								<template x-if="lc.transfer_block_reason"><div class="alert warning" x-text="__(lc.transfer_block_reason)"></div></template>
								<form class="row" x-show="!lc.transfer_block_reason" @submit.prevent="requestTransfer()">
									<input class="input ltr" style="max-width: 360px" type="text" x-model="transferTo" placeholder="owner@example.com / team-name" spellcheck="false">
									<button class="btn primary" type="submit" :disabled="lcBusy.transfer || !transferTo.trim() || site.status !== 'Active'"><span class="spinner" x-show="lcBusy.transfer"></span> {{ _("Request transfer") }}</button>
								</form>
								<template x-if="transferResult">
									<div class="stack">
										<div class="alert warning" x-show="!transferResult.email_sent">{{ _("The email could not be sent. Share this link with the new owner:") }}</div>
										<div class="codebox mono"><span x-text="transferResult.transfer_url"></span><button class="btn sm" type="button" @click="nx.copy(transferResult.transfer_url)">{{ _("Copy") }}</button></div>
									</div>
								</template>
							</div>
							<div class="card-body flush" x-show="lc.transfers.length">
								<table class="nx-table">
									<thead><tr><th>{{ _("Pending transfer to") }}</th><th>{{ _("Expires") }}</th><th></th></tr></thead>
									<tbody>
										<template x-for="tr in lc.transfers" :key="tr.name">
											<tr>
												<td class="ltr" x-text="tr.to_team || tr.to_email"></td>
												<td class="nowrap" x-text="nx.fmtDate(tr.expires_on)"></td>
												<td class="actions"><button class="btn sm ghost" type="button" :disabled="lcBusy.transfer" @click="cancelTransfer(tr.name)">{{ _("Cancel") }}</button></td>
											</tr>
										</template>
									</tbody>
								</table>
							</div>
						</section>

						<!-- Rename -->
						<section class="card" x-show="lc.can_admin && !lc.is_staging">
							<div class="card-head"><h2>{{ _("Rename site") }}</h2></div>
							<div class="card-body stack">
								<span class="muted">{{ _("Give the site a new name. The database and files stay the same; the old name is kept as a domain so existing links keep working.") }}</span>
								<form class="row" @submit.prevent="renameSite()">
									<input class="input ltr" style="max-width: 360px" type="text" x-model="renameTo" :placeholder="lc.custom_names ? 'erp.example.com' : 'new-name'" spellcheck="false">
									<button class="btn primary" type="submit" :disabled="lcBusy.rename || !renameTo.trim() || site.status !== 'Active'"><span class="spinner" x-show="lcBusy.rename"></span> {{ _("Rename") }}</button>
								</form>
								<template x-if="renameTo.trim()"><div class="small muted"><span>{{ _("New name") }}:</span> <span class="ltr" x-text="renamePreview()"></span></div></template>
								<template x-if="renameResult && renameResult.dns_hint"><div class="alert info" x-text="renameResult.dns_hint.message"></div></template>
							</div>
						</section>
					</div>
				</template>
			</div>

			<!-- Jobs -->
			<section class="card" x-show="tab === 'jobs'">
				<div class="card-head">
					<h2>{{ _("Jobs") }}</h2>
					<span class="small muted" x-show="active">{{ _("Refreshing automatically") }}</span>
				</div>
				<div class="card-body flush">
					<template x-if="!site.jobs.length"><div class="empty">{{ _("No jobs yet.") }}</div></template>
					<template x-for="j in site.jobs" :key="j.name">
						<div style="border-block-end: 1px solid var(--nx-border)">
							<div class="row" style="padding: 10px 18px; cursor: pointer" @click="toggleJob(j.name)">
								<span class="mono" x-text="j.kind"></span>
								<span class="spacer"></span>
								<span class="small muted nowrap" x-text="nx.fmtDate(j.creation)"></span>
								<span :class="nx.statusClass(j.status)" x-text="__(j.status)"></span>
							</div>
							<template x-if="openJob === j.name">
								<div style="padding: 0 18px 14px">
									<template x-if="!jobDetail"><div class="loading"><span class="spinner"></span></div></template>
									<template x-if="jobDetail">
										<div class="stack">
											<template x-if="jobDetail.error"><pre class="log" x-text="jobDetail.error"></pre></template>
											<template x-if="!jobDetail.steps.length"><div class="small muted">{{ _("Waiting for the server agent to pick up this job…") }}</div></template>
											<ul class="steps">
												<template x-for="s in jobDetail.steps" :key="s.idx">
													<li>
														<div class="step-head" @click="toggleStep(s.idx)">
															<span class="small muted" x-text="s.idx"></span>
															<span class="name" x-text="s.name"></span>
															<span :class="nx.statusClass(s.status)" x-text="__(s.status)"></span>
														</div>
														<template x-if="openSteps[s.idx] && s.output"><pre class="log" x-text="s.output"></pre></template>
													</li>
												</template>
											</ul>
										</div>
									</template>
								</div>
							</template>
						</div>
					</template>
				</div>
			</section>

			<!-- Settings -->
			<div class="stack" x-show="tab === 'settings'">
				<section class="card">
					<div class="card-head"><h2>{{ _("Migrate") }}</h2></div>
					<div class="card-body row between">
						<span class="muted">{{ _("Run database migrations (bench migrate) for this site.") }}</span>
						<button class="btn" type="button" :disabled="site.status !== 'Active' || busy.migrate"
							@click="run('migrate', {}, __('Run migrate on {0}?', [site.name]))">{{ _("Migrate") }}</button>
					</div>
				</section>
				<section class="card" x-show="site.can_drop">
					<div class="card-head"><h2 style="color: var(--nx-danger)">{{ _("Drop site") }}</h2></div>
					<div class="card-body stack">
						<span class="muted">{{ _("The site is backed up and then deleted from the server. This cannot be undone.") }}</span>
						<div class="row">
							<input class="input ltr" style="max-width: 320px" type="text" x-model="dropConfirm" :placeholder="site.name">
							<button class="btn danger solid" type="button" :disabled="dropConfirm !== site.name || busy.drop || ['Moving', 'Archived'].includes(site.status)" @click="drop()">{{ _("Drop site") }}</button>
						</div>
						<span class="small muted">{{ _("Type the site name to confirm") }}</span>
					</div>
				</section>
			</div>
		</div>
	</template>
</div>
{% endblock %}
