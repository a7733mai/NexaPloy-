[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexaploy-agent"
version = "0.1.0"
description = "Nexaploy per-server agent: runs Frappe benches and sites on Docker Compose"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
nexaploy = "nexaploy_agent.cli:main"
nexaploy-agent = "nexaploy_agent.agent_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nexaploy_agent*"]

[tool.setuptools.package-data]
nexaploy_agent = [
    "templates/*",
    "templates/**/*",
    "templates/**/.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
